<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>《再续西游》Hackathon Demo</title>
    <meta name="description" content="《再续西游》黑客松演示：两关战斗、装备成长、太上老君炼制与链接联机。" />
    <meta property="og:title" content="《再续西游》Hackathon Demo" />
    <meta property="og:description" content="不是怀旧截图，是现在就能玩的西游。" />
    <meta property="og:type" content="video.other" />
    <meta property="og:url" content="https://zaixu.qmledmq.cn:8443/demo/" />
    <meta property="og:image" content="https://zaixu.qmledmq.cn:8443/demo/poster.jpg" />
    <meta property="og:video" content="https://zaixu.qmledmq.cn:8443/demo/zaixu-xiyou-hackathon.mp4" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        letter-spacing: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #0b0a0d;
        color: #f9d6a4;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        width: min(1440px, calc(100% - 32px));
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      header {
        min-height: 76px;
      }

      h1 {
        font-family: "STKaiti", serif;
        font-size: clamp(24px, 3vw, 38px);
        font-weight: 700;
      }

      .status {
        color: #e48f4f;
        font: 700 13px/1 Menlo, monospace;
      }

      main {
        width: min(1440px, calc(100% - 32px));
        margin: auto;
        display: grid;
        place-items: center;
      }

      .player {
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border: 1px solid rgba(241, 190, 130, 0.72);
        border-radius: 6px;
        background: #000;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.56), 0 0 34px rgba(228, 143, 79, 0.12);
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #000;
      }

      footer {
        min-height: 86px;
        border-top: 1px solid rgba(131, 68, 45, 0.55);
        margin-top: 24px;
      }

      .tagline {
        color: #f1be82;
        font-size: 15px;
      }

      nav {
        display: flex;
        gap: 12px;
      }

      a {
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        padding: 0 18px;
        border: 1px solid #83442d;
        border-radius: 4px;
        color: #fff2cb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }

      a.primary {
        border-color: #e48f4f;
        background: #c55c36;
      }

      a:hover {
        border-color: #f1be82;
      }

      @media (max-width: 720px) {
        header,
        footer {
          align-items: flex-start;
          flex-direction: column;
          justify-content: center;
          padding: 16px 0;
        }

        footer {
          align-items: stretch;
        }

        nav {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        a {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>再续西游</h1>
      <div class="status">HACKATHON DEMO · 1080P60</div>
    </header>
    <main>
      <div class="player">
        <video controls playsinline preload="metadata" poster="poster.jpg">
          <source src="zaixu-xiyou-hackathon.mp4" type="video/mp4" />
          你的浏览器不支持 MP4 视频播放。
        </video>
      </div>
    </main>
    <footer>
      <p class="tagline">不是怀旧截图，是现在就能玩的西游。</p>
      <nav aria-label="项目链接">
        <a class="primary" href="https://zaixu.qmledmq.cn:8443/">立即开打</a>
        <a href="https://github.com/Daily-AC/zmxy3-remake">查看源码</a>
      </nav>
    </footer>
  </body>
</html>
